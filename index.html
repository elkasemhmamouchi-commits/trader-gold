<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>تاجر الذهب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تاجر الذهب">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Tajawal:wght@400;700;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Tajawal', sans-serif;
  background: radial-gradient(ellipse at top, #1a1208 0%, #0a0806 70%);
  color: #f5e6c8;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  overflow-x: hidden;
}
.game { width: 100%; max-width: 420px; display: flex; flex-direction: column; }
.screen { display: flex; flex-direction: column; flex: 1; animation: fadeIn .35s ease; }
.screen.hidden { display: none !important; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#startScreen { justify-content: flex-start; align-items: center; text-align: center; padding: 10px 5px; overflow-y: auto; }
.crest { font-size: 60px; animation: glow 2s ease-in-out infinite; }
@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 20px #d4a017); transform: scale(1); }
  50% { filter: drop-shadow(0 0 40px #fbbf24); transform: scale(1.06); }
}
#startScreen h1 {
  font-family: 'Cinzel', serif; font-size: 26px; color: #fbbf24;
  text-shadow: 0 0 30px rgba(251,191,36,.5); margin: 6px 0 12px; letter-spacing: 3px;
}
.tabs {
  display: flex; gap: 4px; width: 100%; background: rgba(15,12,8,.95);
  border: 1px solid rgba(212,160,23,.25); border-radius: 12px;
  padding: 4px; margin-bottom: 12px;
}
.tab {
  flex: 1; background: transparent; border: none; color: #a89070;
  font-family: inherit; font-weight: 700; font-size: 12px;
  padding: 8px 4px; border-radius: 8px; cursor: pointer; transition: all .2s;
}
.tab.active { background: linear-gradient(135deg, #d4a017, #b8860b); color: #0a0806; }
.tab-content { width: 100%; animation: fadeIn .25s ease; }
.tab-content.hidden { display: none !important; }
.daily-reward {
  background: linear-gradient(135deg, rgba(74,222,128,.18), rgba(34,197,94,.22));
  border: 1px solid rgba(74,222,128,.5);
  border-radius: 12px; padding: 10px 16px;
  margin-bottom: 10px; font-size: 13px; color: #4ade80;
  animation: pulseGreen 2s infinite;
}
.daily-reward b { color: #86efac; }
.daily-reward.hidden { display: none !important; }
@keyframes pulseGreen {
  0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,.4); }
  50% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
}
.difficulty-select { display: flex; flex-direction: column; gap: 7px; }
.diff-btn {
  background: rgba(26,20,16,.95); border: 1px solid rgba(212,160,23,.3);
  border-radius: 14px; padding: 10px 14px;
  display: flex; flex-direction: column; gap: 2px;
  cursor: pointer; font-family: inherit; color: #f5e6c8;
  text-align: right; transition: all .2s;
}
.diff-btn:active { transform: scale(.97); border-color: #fbbf24; box-shadow: 0 0 20px rgba(251,191,36,.3); }
.diff-name { font-weight: 900; font-size: 15px; color: #fbbf24; }
.diff-detail { font-size: 10px; color: #a89070; }
.diff-best { font-size: 10px; color: #4ade80; }
.diff-best b { color: #86efac; font-family: 'Cinzel', serif; }
.settings-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding: 8px 12px;
  background: rgba(26,20,16,.6); border-radius: 10px;
}
.toggle-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a89070; cursor: pointer; }
.toggle-label input { accent-color: #d4a017; width: 16px; height: 16px; }
.btn-danger-small {
  background: transparent; border: 1px solid rgba(239,68,68,.5);
  color: #ef4444; font-family: inherit; font-size: 11px;
  padding: 5px 10px; border-radius: 8px; cursor: pointer;
}
.ach-summary { text-align: center; font-size: 12px; color: #a89070; margin-bottom: 10px; padding: 6px; }
.ach-summary b { color: #fbbf24; font-family: 'Cinzel', serif; font-size: 15px; }
.ach-list { display: flex; flex-direction: column; gap: 6px; max-height: 55dvh; overflow-y: auto; padding: 2px; }
.ach-item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(26,20,16,.85); border: 1px solid rgba(212,160,23,.2);
  border-radius: 10px; padding: 8px 12px; transition: all .2s;
}
.ach-item.unlocked { border-color: rgba(74,222,128,.4); background: linear-gradient(135deg, rgba(26,20,16,.95), rgba(34,197,94,.08)); }
.ach-item.locked { opacity: .55; }
.ach-icon { font-size: 22px; width: 32px; text-align: center; }
.ach-info { flex: 1; text-align: right; }
.ach-title { font-weight: 700; font-size: 13px; color: #fbbf24; }
.ach-desc { font-size: 10px; color: #a89070; }
.ach-check { font-size: 16px; }
.ach-item.unlocked .ach-check { color: #4ade80; }
.ach-item.locked .ach-check { color: #6b5a40; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px; }
.stat-card { background: rgba(26,20,16,.9); border: 1px solid rgba(212,160,23,.25); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stat-card .stat-icon { font-size: 22px; display: block; margin-bottom: 4px; }
.stat-card .stat-num { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; color: #fbbf24; display: block; }
.stat-card .stat-lbl { font-size: 10px; color: #a89070; }
.top-bar { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.icon-btn { background: rgba(26,20,16,.9); border: 1px solid rgba(212,160,23,.3); border-radius: 10px; padding: 8px 10px; font-size: 18px; cursor: pointer; color: #f5e6c8; }
.stat { background: rgba(26,20,16,.9); border: 1px solid rgba(212,160,23,.3); border-radius: 10px; padding: 6px 8px; text-align: center; }
.stat-label { font-size: 10px; color: #a89070; display: block; }
.stat-value { font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,.3); }
#money { color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,.4); }
.time-wrap { margin-bottom: 8px; }
.time-header { display: flex; justify-content: space-between; font-size: 12px; color: #a89070; margin-bottom: 4px; padding: 0 4px; }
#timeVal { font-family: 'Cinzel', serif; font-weight: 900; font-size: 14px; color: #fbbf24; }
.time-bar { height: 10px; background: rgba(26,20,16,.9); border-radius: 5px; overflow: hidden; border: 1px solid rgba(212,160,23,.25); }
.time-fill { height: 100%; width: 100%; border-radius: 5px; background: linear-gradient(90deg, #b8860b, #fbbf24); transition: width .35s ease, background .35s; }
.time-fill.warn { background: linear-gradient(90deg, #dc2626, #ef4444); animation: pulse .7s infinite; }
.time-fill.gain { background: linear-gradient(90deg, #22c55e, #4ade80); }
@keyframes pulse { 50% { opacity: .5; } }
.event-banner {
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, rgba(251,191,36,.25), rgba(212,160,23,.35));
  border: 1px solid #fbbf24; border-radius: 10px;
  padding: 8px 12px; margin-bottom: 8px;
  animation: eventIn .4s ease, eventPulse 1s ease-in-out infinite;
}
.event-banner.hidden { display: none !important; }
@keyframes eventIn { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes eventPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.4); }
  50% { box-shadow: 0 0 0 8px rgba(251,191,36,0); }
}
.event-icon { font-size: 20px; }
.event-title { font-weight: 900; font-size: 13px; color: #fbbf24; flex: 1; text-align: right; }
.event-desc { font-size: 10px; color: #d4c4a0; }
.combo-banner {
  position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #d4a017, #fbbf24);
  color: #0a0806; padding: 6px 18px; border-radius: 20px;
  font-weight: 900; font-size: 14px; z-index: 100;
  box-shadow: 0 0 25px rgba(251,191,36,.7);
}
.combo-banner.hidden { display: none !important; }
.combo-banner.pop { animation: comboPop .5s ease; }
@keyframes comboPop {
  0% { transform: translateX(-50%) scale(.4); }
  60% { transform: translateX(-50%) scale(1.2); }
  100% { transform: translateX(-50%) scale(1); }
}
.goods { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.good {
  background: linear-gradient(145deg, rgba(26,20,16,.98), rgba(15,12,8,.98));
  border: 1px solid rgba(212,160,23,.25); border-radius: 12px; padding: 6px 10px;
}
.good-top { display: flex; justify-content: space-between; align-items: center; }
.good-name { font-weight: 700; font-size: 12px; }
.good-name small { color: #a89070; font-size: 9px; margin-right: 4px; }
.good-price { font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; color: #fbbf24; transition: color .2s; }
.good-price.up { color: #4ade80; }
.good-price.down { color: #ef4444; }
.good-price.bump { animation: priceBump .3s; }
@keyframes priceBump { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chart-wrap { height: 24px; margin: 2px 0; }
.chart { width: 100%; height: 100%; display: block; }
.good-actions { display: flex; gap: 5px; }
.good-actions button {
  flex: 1; padding: 5px; border: none; border-radius: 6px;
  font-family: inherit; font-weight: 700; font-size: 11px; cursor: pointer;
}
.btn-buy { background: linear-gradient(135deg, #d4a017, #b8860b); color: #0a0806; }
.btn-sell { background: linear-gradient(135deg, #8b5a2b, #5a3a1a); color: #f5e6c8; }
.btn-sell-all { background: linear-gradient(135deg, #22c55e, #16a34a); color: #0a0806; flex: 0 0 auto; padding: 5px 8px; }
.btn-buy:disabled, .btn-sell:disabled, .btn-sell-all:disabled { opacity: .3; cursor: not-allowed; }
.btn-buy.pulse { animation: btnPulse 1.2s infinite; }
.btn-sell.pulse-profit { animation: btnPulseGreen 1s infinite; }
@keyframes btnPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(212,160,23,.7); }
  50% { box-shadow: 0 0 0 6px rgba(212,160,23,0); }
}
@keyframes btnPulseGreen {
  0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,.8); }
  50% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
}
.good-owned { font-size: 9px; color: #a89070; margin-top: 2px; text-align: center; min-height: 11px; }
.good-owned.profit { color: #4ade80; font-weight: 700; }
.good-owned.loss { color: #ef4444; }
.btn-ad {
  width: 100%; padding: 7px; margin-top: 8px;
  background: linear-gradient(135deg, #5a3a1a, #8b5a2b);
  border: 1px solid #d4a017; border-radius: 10px;
  color: #f5e6c8; font-family: inherit; font-weight: 700; font-size: 12px; cursor: pointer;
}
.btn-ad small { font-size: 10px; opacity: .8; }
.btn-ad:disabled { opacity: .5; }
.news-ticker {
  display: flex; align-items: center; gap: 6px;
  background: rgba(15,12,8,.9); border: 1px solid rgba(212,160,23,.2);
  border-radius: 8px; padding: 5px 10px; margin-top: 8px;
  font-size: 11px; color: #a89070; overflow: hidden; white-space: nowrap;
}
.news-label { flex-shrink: 0; }
.news-text { flex: 1; overflow: hidden; text-overflow: ellipsis; animation: tickerFade 1s ease; }
@keyframes tickerFade { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
#endScreen { justify-content: center; align-items: center; text-align: center; padding: 15px; overflow-y: auto; }
.end-icon { font-size: 72px; animation: glow 2s infinite; }
#endScreen h2 { font-family: 'Cinzel', serif; font-size: 24px; color: #fbbf24; margin: 6px 0; letter-spacing: 2px; }
.end-stats { background: rgba(26,20,16,.9); border: 1px solid rgba(212,160,23,.3); border-radius: 14px; padding: 14px 24px; margin: 12px 0; font-size: 13px; line-height: 1.9; width: 100%; max-width: 300px; }
.end-stats b { color: #fbbf24; font-family: 'Cinzel', serif; font-size: 15px; }
.new-record { background: linear-gradient(135deg, rgba(251,191,36,.2), rgba(251,191,36,.35)); border: 1px solid #fbbf24; color: #fbbf24; padding: 6px 18px; border-radius: 20px; font-weight: 900; font-size: 13px; margin: 6px 0; animation: pulseGold 1.5s infinite; }
.new-record.hidden { display: none !important; }
@keyframes pulseGold {
  0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251,191,36,.6); }
  50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(251,191,36,0); }
}
.end-achievements { background: linear-gradient(135deg, rgba(26,20,16,.9), rgba(34,197,94,.08)); border: 1px solid rgba(74,222,128,.35); border-radius: 14px; padding: 10px 14px; margin: 8px 0; width: 100%; max-width: 300px; }
.end-achievements.hidden { display: none !important; }
.end-ach-title { font-size: 11px; color: #4ade80; font-weight: 700; margin-bottom: 6px; }
.end-ach-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.end-ach-item { background: rgba(74,222,128,.15); border: 1px solid rgba(74,222,128,.4); border-radius: 8px; padding: 3px 8px; font-size: 10px; color: #86efac; }
.end-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; width: 100%; max-width: 280px; }
.btn-gold { background: linear-gradient(135deg, #fbbf24, #d4a017); border: none; color: #0a0806; padding: 12px 40px; border-radius: 14px; font-family: inherit; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 0 25px rgba(251,191,36,.4), inset 0 -3px 0 rgba(0,0,0,.2); }
.btn-gold:active { transform: scale(.96); }
.btn-secondary { background: transparent; border: 1px solid rgba(212,160,23,.5); color: #f5e6c8; padding: 10px; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
#floatLayer { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
.float-num { position: absolute; font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; animation: floatUp 1.2s ease-out forwards; text-shadow: 0 2px 10px rgba(0,0,0,.9); transform: translate(-50%, 0); }
.float-num.positive { color: #4ade80; }
.float-num.negative { color: #ef4444; }
.float-num.gold { color: #fbbf24; }
@keyframes floatUp {
  0% { transform: translate(-50%, 0) scale(.5); opacity: 0; }
  20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
  100% { transform: translate(-50%, -90px) scale(1); opacity: 0; }
}
#flashOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 150; opacity: 0; }
#flashOverlay.flash-green { background: rgba(74,222,128,.2); animation: flash .35s; }
#flashOverlay.flash-red { background: rgba(239,68,68,.28); animation: flash .35s; }
#flashOverlay.flash-gold { background: rgba(251,191,36,.25); animation: flash .5s; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
.game.shake { animation: shake .3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
#toastLayer { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: 90%; max-width: 360px; }
.toast { background: linear-gradient(135deg, #d4a017, #fbbf24); color: #0a0806; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.5), 0 0 30px rgba(251,191,36,.5); animation: toastIn .4s ease; }
.toast.green { background: linear-gradient(135deg, #22c55e, #4ade80); box-shadow: 0 6px 20px rgba(0,0,0,.5), 0 0 30px rgba(74,222,128,.5); }
@keyframes toastIn { from { transform: translateY(-20px) scale(.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastOut { to { transform: translateY(-20px) scale(.9); opacity: 0; } }
</style>
</head>
<body>
<div class="game" id="game">
  <div class="screen" id="startScreen">
    <div class="crest">👑</div>
    <h1>تاجر الذهب</h1>
    <div class="tabs">
      <button class="tab active" data-tab="play">🎮 لعب</button>
      <button class="tab" data-tab="ach">🏆 إنجازات</button>
      <button class="tab" data-tab="stats">📊 إحصائيات</button>
    </div>
    <div class="tab-content" id="tab-play">
      <div class="daily-reward hidden" id="dailyReward">🎁 مكافأة يومية: <b>+300 💰</b></div>
      <div class="difficulty-select">
        <button class="diff-btn" data-diff="easy">
          <span class="diff-name">🌱 سهل</span>
          <span class="diff-detail">⏱️ 60s • 🎯 1500</span>
          <span class="diff-best">🏆 أفضل: <b id="best-easy">0</b></span>
        </button>
        <button class="diff-btn" data-diff="medium">
          <span class="diff-name">⚖️ متوسط</span>
          <span class="diff-detail">⏱️ 45s • 🎯 2000</span>
          <span class="diff-best">🏆 أفضل: <b id="best-medium">0</b></span>
        </button>
        <button class="diff-btn" data-diff="hard">
          <span class="diff-name">🔥 خبير</span>
          <span class="diff-detail">⏱️ 35s • 🎯 3000</span>
          <span class="diff-best">🏆 أفضل: <b id="best-hard">0</b></span>
        </button>
      </div>
      <div class="settings-row">
        <label class="toggle-label">
          <input type="checkbox" id="hapticsToggle" checked>
          <span>📳 اهتزاز</span>
        </label>
        <button class="btn-danger-small" id="resetBtn">🗑️ حذف التقدم</button>
      </div>
    </div>
    <div class="tab-content hidden" id="tab-ach">
      <div class="ach-summary"><b id="achCount">0</b> / <span id="achTotal">12</span> مفتوح</div>
      <div class="ach-list" id="achList"></div>
    </div>
    <div class="tab-content hidden" id="tab-stats">
      <div class="stats-grid" id="statsGrid"></div>
    </div>
  </div>

  <div class="screen hidden" id="playScreen">
    <div class="event-banner hidden" id="eventBanner">
      <span class="event-icon" id="eventIcon">🚀</span>
      <span class="event-title" id="eventTitle">طفرة ذهبية!</span>
      <span class="event-desc" id="eventDesc">الذهب +30%</span>
    </div>
    <div class="top-bar">
      <button class="icon-btn" id="muteBtn">🔊</button>
      <div class="stat">
        <span class="stat-label">💰 الثروة</span>
        <span class="stat-value" id="money">1000</span>
      </div>
      <div class="stat">
        <span class="stat-label">🎯 الهدف</span>
        <span class="stat-value" id="goal">2000</span>
      </div>
    </div>
    <div class="time-wrap">
      <div class="time-header">
        <span>⏱️ الوقت</span>
        <span id="timeVal">45.0s</span>
      </div>
      <div class="time-bar"><div class="time-fill" id="timeFill"></div></div>
    </div>
    <div class="combo-banner hidden" id="comboBanner">🔥 Combo ×<span id="comboVal">2</span></div>
    <div class="goods" id="goods"></div>
    <button class="btn-ad" id="adBtn">📺 شاهد إعلان <small>+200 💰 +5s</small></button>
    <div class="news-ticker">
      <span class="news-label">📰</span>
      <span class="news-text" id="newsText">...</span>
    </div>
  </div>

  <div class="screen hidden" id="endScreen">
    <div class="end-icon" id="endIcon">🏆</div>
    <h2 id="endTitle">فوز</h2>
    <p id="endMsg" style="color:#a89070;font-size:13px;"></p>
    <div class="new-record hidden" id="newRecord">🌟 رقم قياسي جديد!</div>
    <div class="end-stats">
      <div>💰 الثروة: <b id="endMoney">0</b></div>
      <div>🔥 أفضل Combo: <b id="endCombo">0</b></div>
      <div>⏱️ الوقت: <b id="endTime">0</b></div>
      <div>📈 ربح الجلسة: <b id="endProfit">0</b></div>
      <div>🏆 أفضل (<span id="endDiffName">متوسط</span>): <b id="endBest">0</b></div>
    </div>
    <div class="end-achievements hidden" id="endAchievements">
      <div class="end-ach-title">🏅 إنجازات مفتوحة:</div>
      <div class="end-ach-list" id="endAchList"></div>
    </div>
    <div class="end-actions">
      <button class="btn-gold" id="againBtn">العب مجدداً</button>
      <button class="btn-secondary" id="changeDiffBtn">تغيير الصعوبة</button>
    </div>
  </div>
</div>

<div id="floatLayer"></div>

  var s = getStats();
  var cards = [
    { icon: '🎮', num: s.totalRuns, lbl: 'جلسات' },
    { icon: '🏆', num: s.totalWins, lbl: 'انتصارات' },
    { icon: '🤝', num: s.totalTrades, lbl: 'صفقات' },
    { icon: '📈', num: s.totalProfit, lbl: 'ربح تراكمي' },
    { icon: '💰', num: s.lifetimeEarned, lbl: 'مكتسب' },
    { icon: '📺', num: s.adsWatched, lbl: 'إعلانات' }
  ];
  grid.innerHTML = '';
  cards.forEach(function (c) {
    var div = document.createElement('div');
    div.className = 'stat-card';
    div.innerHTML = '<span class="stat-icon">' + c.icon + '</span><span class="stat-num">' + c.num + '</span><span class="stat-lbl">' + c.lbl + '</span>';
    grid.appendChild(div);
  });
}
function spawnFloat(text, type, targetEl) {
  var layer = $('floatLayer'); if (!layer) return;
  var el = document.createElement('div');
  el.className = 'float-num ' + type;
  el.textContent = text;
  var x = window.innerWidth / 2, y = window.innerHeight / 2;
  if (targetEl && targetEl.getBoundingClientRect) {
    var r = targetEl.getBoundingClientRect();
    x = r.left + r.width / 2; y = r.top;
  }
  el.style.left = x + 'px'; el.style.top = y + 'px';
  layer.appendChild(el);
  setTimeout(function () { el.remove(); }, 1300);
}
function flash(color) {
  var o = $('flashOverlay'); if (!o) return;
  o.className = ''; void o.offsetWidth;
  o.className = 'flash-' + color;
}
function shake() {
  var g = $('game'); if (!g) return;
  g.classList.add('shake');
  setTimeout(function () { g.classList.remove('shake'); }, 320);
}
function showCombo() {
  var b = $('comboBanner'); if (!b) return;
  $('comboVal').textContent = GS.combo;
  b.classList.remove('hidden','pop');
  void b.offsetWidth;
  b.classList.add('pop');
}
function hideCombo() { var b = $('comboBanner'); if (b) b.classList.add('hidden'); }
function priceTick() {
  if (!GS.active) return;
  GS.goods.forEach(function (g, i) {
    if (Math.random() < 0.18) g.trend = [-1, 0, 1][Math.floor(Math.random() * 3)];
    var change = (g.trend * g.vol * 0.4) + (Math.random() - 0.5) * g.vol * 2;
    g.price = Math.max(10, Math.round(g.price * (1 + change * (CFG.volMult || 1) * GS.eventVolBoost)));
    g.history.push(g.price);
    if (g.history.length > 45) g.history.shift();
    updateGoodUI(i);
  });
}
function timeTick() {
  if (!GS.active || GS.timerPaused) return;
  GS.time = Math.max(0, GS.time - 0.5);
  updateTimeUI();
  if (GS.time < 10 && GS.time > 0 && Math.floor(GS.time * 2) % 2 === 0) Sound.warning();
  if (GS.time <= 0) endGame(false);
}
function rotateNews() {
  var t = $('newsText'); if (!t) return;
  t.textContent = NEWS_ITEMS[Math.floor(Math.random() * NEWS_ITEMS.length)];
  t.style.animation = 'none';
  void t.offsetWidth;
  t.style.animation = '';
}
function startGame(diff) {
  if (diff) currentDifficulty = diff;
  var dc = DIFFICULTIES[currentDifficulty];
  CFG.startGold = dc.startGold;
  CFG.goalGold = dc.goalGold;
  CFG.startTime = dc.startTime;
  CFG.timeGain = dc.timeGain;
  CFG.timeLoss = dc.timeLoss;
  CFG.volMult = dc.volMult;
  Sound.init();
  var dailyBonus = 0;
  if (dailyReady()) { dailyBonus = claimDaily(); refreshStartScreen(); }
  GS.money = CFG.startGold + dailyBonus;
  GS.startMoney = GS.money;
  GS.time = CFG.startTime;
  GS.maxTime = CFG.startTime;
  GS.combo = 0; GS.bestCombo = 0;
  GS.active = true; GS.hitGoal = false;
  GS.adReady = true; GS.adCooldownUntil = 0; GS.timerPaused = false;
  GS.tradesThisRun = 0; GS.adsThisRun = 0;
  GS.achievementsThisRun = [];
  GS.eventVolBoost = 1;
  bumpStat('totalRuns');
  $('startScreen').classList.add('hidden');
  $('endScreen').classList.add('hidden');
  $('playScreen').classList.remove('hidden');
  void $('playScreen').offsetWidth;
  initGoods();
  buildUI();
  $('goal').textContent = CFG.goalGold;
  updateWallet(); updateTimeUI(); hideCombo();
  $('eventBanner').classList.add('hidden');
  rotateNews();
  var adBtn = $('adBtn');
  adBtn.disabled = false;
  adBtn.innerHTML = '📺 شاهد إعلان <small>+200 💰 +5s</small>';
  clearInterval(tickInterval); clearInterval(timerInterval);
  clearTimeout(eventDelayTimer); clearTimeout(eventEndTimer);
  clearInterval(newsInterval);
  tickInterval = setInterval(priceTick, CFG.tickMs);
  timerInterval = setInterval(timeTick, 500);
  newsInterval = setInterval(rotateNews, 7000);
  scheduleNextEvent();
  if (dailyBonus > 0) {
    setTimeout(function () {
      spawnFloat('🎁 +' + dailyBonus, 'gold');
      flash('gold');
      Sound.reward();
      showToast('🎁 مكافأة يومية +' + dailyBonus, 'green');
    }, 400);
  }
}
function endGame(won) {
  if (!GS.active) return;
  GS.active = false;
  clearInterval(tickInterval); clearInterval(timerInterval); clearInterval(newsInterval);
  clearTimeout(eventDelayTimer); clearTimeout(eventEndTimer);
  won = won || GS.money >= CFG.goalGold;
  if (won) { bumpStat('totalWins'); unlockWinAch(currentDifficulty); }
  if (won && GS.time < 5) {
    if (unlockAch('clutch')) {
      var a = ACHIEVEMENTS.find(function (x) { return x.id === 'clutch'; });
      if (a) { GS.achievementsThisRun.push(a); showToast('🏅 ' + a.title + ' — ' + a.desc, 'green'); }
    }
  }
  var isNewRecord = saveBest(currentDifficulty, GS.money);
  var profit = GS.money - GS.startMoney;
  $('playScreen').classList.add('hidden');
  $('endScreen').classList.remove('hidden');
  $('endIcon').textContent = won ? '🏆' : '💸';
  $('endTitle').textContent = won ? 'فوز ساحق!' : 'انتهى الوقت';
  $('endMsg').textContent = won ? 'أنت تاجر من الطراز الرفيع' : 'حاول مجدداً — الوقت موارد';
  $('endMoney').textContent = GS.money;
  $('endCombo').textContent = GS.bestCombo;
  $('endTime').textContent = GS.time.toFixed(1) + 's';
  $('endProfit').textContent = (profit >= 0 ? '+' : '') + profit;
  $('endDiffName').textContent = DIFFICULTIES[currentDifficulty].name;
  $('endBest').textContent = getBest(currentDifficulty);
  $('newRecord').classList.toggle('hidden', !isNewRecord);
  var achBox = $('endAchievements');
  var achList = $('endAchList');
  if (GS.achievementsThisRun.length > 0) {
    achBox.classList.remove('hidden');
    achList.innerHTML = '';
    GS.achievementsThisRun.forEach(function (a) {
      var span = document.createElement('span');
      span.className = 'end-ach-item';
      span.textContent = a.icon + ' ' + a.title;
      achList.appendChild(span);
    });
  } else achBox.classList.add('hidden');
  if (won) Sound.win(); else Sound.lose();
  flash(won ? 'gold' : 'red');
}
function attachListeners() {
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      Sound.init(); Sound.click();
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function (x) { x.classList.add('hidden'); });
      t.classList.add('active');
      $('tab-' + t.getAttribute('data-tab')).classList.remove('hidden');
    });
  });
  document.querySelectorAll('.diff-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      Sound.init();
      startGame(b.getAttribute('data-diff'));
    });
  });
  var hapticsToggle = $('hapticsToggle');
  if (hapticsToggle) hapticsToggle.addEventListener('change', function (e) {
    STORAGE.set('traderHaptics', e.target.checked);
    if (e.target.checked) haptic('light');
  });
  var resetBtn = $('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', function () {
    if (confirm('هل تريد حذف كل التقدم؟ لا يمكن التراجع.')) {
      try { localStorage.clear(); } catch (e) {}
      location.reload();
    }
  });
  var againBtn = $('againBtn');
  if (againBtn) againBtn.addEventListener('click', function () { startGame(currentDifficulty); });
  var changeDiffBtn = $('changeDiffBtn');
  if (changeDiffBtn) changeDiffBtn.addEventListener('click', function () {
    $('endScreen').classList.add('hidden');
    $('startScreen').classList.remove('hidden');
    refreshStartScreen();
  });
  var muteBtn = $('muteBtn');
  if (muteBtn) muteBtn.addEventListener('click', function (e) {
    Sound.enabled = !Sound.enabled;
    e.currentTarget.textContent = Sound.enabled ? '🔊' : '🔇';
  });
  var adBtn = $('adBtn');
  if (adBtn) adBtn.addEventListener('click', function () {
    if (!GS.active || !GS.adReady || GS.time < 3) return;
    GS.adReady = false;
    GS.timerPaused = true;
    GS.adsThisRun++;
    bumpStat('adsWatched');
    var btn = $('adBtn');
    btn.disabled = true;
    btn.innerHTML = '📺 جاري العرض...';
    Sound.ad();
    setTimeout(function () {
      GS.money += CFG.adGold;
      addTime(CFG.adTime);
      Sound.buy();
      haptic('light');
      spawnFloat('+' + CFG.adGold + ' 💰', 'gold');
      flash('gold');
      updateWallet();
      GS.timerPaused = false;
      checkAchievements();
      GS.adCooldownUntil = Date.now() + CFG.adCooldownMs;
      (function tickCooldown() {
        var r = GS.adCooldownUntil - Date.now();
        if (r <= 0 || !GS.active) {
          GS.adReady = true;
          btn.disabled = false;
          btn.innerHTML = '📺 شاهد إعلان <small>+200 💰 +5s</small>';
          return;
        }
        btn.innerHTML = '⏳ ' + Math.ceil(r / 1000) + 's';
        setTimeout(tickCooldown, 500);
      })();
      if (GS.money >= CFG.goalGold) endGame(true);
    }, 2000);
  });
  window.addEventListener('resize', function () {
    GS.goods.forEach(function (g, i) { setupCanvas(i); drawChart(i); });
  });
  refreshStartScreen();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', attachListeners);
} else {
  attachListeners();
}
</script>
</body>
</html>
